name: Build macOS ARM64 DMG

on:
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and packaging dependencies
        run: |
          brew update
          brew install ninja molten-vk ffmpeg dylibbundler

      - name: Configure and Build (CMake + Ninja)
        working-directory: engine
        env:
          KOTOR_FFMPEG_ROOT: /opt/homebrew/opt/ffmpeg
        run: |
          # Avoid failing on empty Windows DLL list on macOS
          python3 -c '
          import re
          p = "CMakeLists.txt"
          txt = open(p).read()
          txt = re.sub(r"if\s*\(\s*TARGET\s+kotor_ffmpeg\s*\)\s+file\s*\(\s*GLOB\s+KOTOR_FFMPEG_DLLS",
                       "if(WIN32 AND TARGET kotor_ffmpeg)\n  file(GLOB KOTOR_FFMPEG_DLLS", txt)
          open(p, "w").write(txt)
          '

          cmake -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKOTOR_ENGINE_WARNINGS_AS_ERRORS=OFF \
            -DKOTOR_ENGINE_BUILD_TESTS=OFF
          cmake --build build-macos --parallel


      - name: Package standalone .app and .dmg
        run: |
          BUILD_DIR="engine/build-macos"
          EXE_PATH="$BUILD_DIR/kotor_engine"

          if [ ! -f "$EXE_PATH" ]; then
            echo "Error: kotor_engine binary not found in $BUILD_DIR"
            exit 1
          fi

          # 1. Create macOS .app bundle directory structure
          APP_DIR="KotOR Remaster.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Frameworks"
          mkdir -p "$APP_DIR/Contents/Resources/vulkan/icd.d"

          # 2. Copy main executable and required shaders folder
          cp "$EXE_PATH" "$APP_DIR/Contents/MacOS/kotor_engine_bin"
          chmod +x "$APP_DIR/Contents/MacOS/kotor_engine_bin"
          cp -R "$BUILD_DIR/shaders" "$APP_DIR/Contents/MacOS/shaders"

          # 3. Create launcher wrapper script (sets MoltenVK path & prompts for GOG install folder)
          cat << 'EOF' > "$APP_DIR/Contents/MacOS/kotor_engine"
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          RESOURCES_DIR="$DIR/../Resources"

          # Point Vulkan loader to bundled MoltenVK ICD
          export VK_ICD_FILENAMES="$RESOURCES_DIR/vulkan/icd.d/MoltenVK_icd.json"
          cd "$DIR"

          # Look for default GOG extract folder in ~/Games/KOTOR_GOG
          GAME_DIR="$HOME/Games/KOTOR_GOG"
          if [ ! -f "$GAME_DIR/chitin.key" ]; then
              GAME_DIR=$(osascript -e 'POSIX path of (choose folder with prompt "Select your KotOR GOG installation folder (containing chitin.key):")' 2>/dev/null)
              if [ -z "$GAME_DIR" ]; then
                  exit 0
              fi
          fi

          exec "$DIR/kotor_engine_bin" \
              --vulkan \
              --chargen-gui \
              --third-person \
              --install "$GAME_DIR" \
              "$@"
          EOF
          chmod +x "$APP_DIR/Contents/MacOS/kotor_engine"

          # 4. Create Info.plist
          cat << 'EOF' > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>kotor_engine</string>
              <key>CFBundleIdentifier</key>
              <string>com.community.kotor-remaster</string>
              <key>CFBundleName</key>
              <string>KotOR Remaster</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 5. Bundle external dynamic libraries (FFmpeg, etc.) into Contents/Frameworks
          dylibbundler -od -b \
            -x "$APP_DIR/Contents/MacOS/kotor_engine_bin" \
            -d "$APP_DIR/Contents/Frameworks/" \
            -p "@executable_path/../Frameworks/"

          # 6. Bundle MoltenVK and its relative ICD manifest
          MOLTENVK_PATH=$(find /opt/homebrew -name "libMoltenVK.dylib" | head -n 1)
          cp "$MOLTENVK_PATH" "$APP_DIR/Contents/Frameworks/libMoltenVK.dylib"
          cat << 'EOF' > "$APP_DIR/Contents/Resources/vulkan/icd.d/MoltenVK_icd.json"
          {
              "file_format_version" : "1.0.0",
              "ICD": {
                  "library_path": "../../../Frameworks/libMoltenVK.dylib",
                  "api_version" : "1.3.0"
              }
          }
          EOF

          # 7. Ad-hoc code sign the bundle (required on Apple Silicon)
          codesign --force --deep --sign - "$APP_DIR"

          # 8. Create compressed .dmg disk image
          mkdir -p dmg_staging
          mv "$APP_DIR" dmg_staging/
          hdiutil create -volname "KotOR Remaster" -srcfolder dmg_staging -ov -format UDZO "KotOR-Remaster-macOS-arm64.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KotOR-Remaster-macOS-arm64-DMG
          path: KotOR-Remaster-macOS-arm64.dmg
